[PHP]
; A call of Mailgun carries a whole mail: up to 40 MB (above it the app answers 406, looking at Content-Length
; before the body is read), so post_max_size stays above 41M; an attachment just over the 20 MB of the mail still
; arrives and is left out as too large. The uploads of the app take files of 25 MB (UploadsFiles::FILE), hence 26M.
; The same file is read in production (PHP_INI_SCAN_DIR in nixpacks.toml).
post_max_size = 100M
upload_max_filesize = 26M
max_file_uploads = 100
variables_order = EGPCS
pcov.directory = .
