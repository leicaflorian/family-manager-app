[PHP]
; The limits of production, loaded after the image's own ini (serversideup-docker-php.ini). A call of Mailgun
; carries a whole mail: up to 40 MB (above it the app answers 406, looking at Content-Length before the body is
; read), so post_max_size stays above 41M; the uploads of the app take files of 25 MB (UploadsFiles::FILE), hence
; 26M. nginx takes bodies up to NGINX_CLIENT_MAX_BODY_SIZE (100M, the image's default), so the app answers with its
; own JSON message and never nginx's 413. Same values as docker/8.5/php.ini of Sail, without the lines for Sail.
post_max_size = 100M
upload_max_filesize = 26M
max_file_uploads = 100
