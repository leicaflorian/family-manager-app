<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- The preview image of the links (og:image): drawn by npm run og-image into public/fameja-app-og-1200x630.png.
       Colours: hero and hero-end of resources/design/tokens.json (light), on-hero white. -->
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0070e0" />
      <stop offset="1" stop-color="#0059b3" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#hero)" />
  <g transform="translate(80 130) scale(0.78)" fill="#ffffff">
    <path d="M 60,300 L 250,110 L 440,300" stroke="#ffffff" stroke-width="55" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="155" cy="300" r="65" />
    <circle cx="345" cy="300" r="65" />
    <circle cx="250" cy="315" r="30" />
  </g>
  <g fill="#ffffff" font-family="Inter, FreeSans, Helvetica, Arial, sans-serif">
    <text x="480" y="320" font-size="104" font-weight="700">Fameja.app</text>
    <text x="482" y="402" font-size="40">Tutto ciò che riguarda la famiglia,</text>
    <text x="482" y="454" font-size="40">in un posto solo.</text>
  </g>
</svg>
