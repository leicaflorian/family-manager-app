<!doctype html>
<html lang="it">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Family Manager</title>
        <style>
            /* The colours are the tokens --canvas, --ink, --ink-soft and --action of resources/css/tokens.css, light and dark */
            :root {
                --canvas: #f4f6fa;
                --ink: #18212f;
                --ink-soft: #5a6575;
                --action: #0070e0;
                color-scheme: light dark;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --canvas: #0f141b;
                    --ink: #e8edf3;
                    --ink-soft: #a3aebd;
                    --action: #5aa8ff;
                }
            }
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-content: center;
                justify-items: center;
                gap: 12px;
                padding: 24px;
                box-sizing: border-box;
                text-align: center;
                background: var(--canvas);
                color: var(--ink);
                font-family:
                    system-ui,
                    -apple-system,
                    'Segoe UI',
                    Roboto,
                    sans-serif;
            }
            img {
                width: 72px;
                height: 72px;
                border-radius: 16px;
            }
            h1 {
                margin: 0;
                font-size: 24px;
            }
            p {
                margin: 0;
                max-width: 28ch;
                color: var(--ink-soft);
                line-height: 1.4;
            }
            button {
                margin-top: 8px;
                min-height: 44px;
                padding: 0 24px;
                border: 0;
                border-radius: 12px;
                font: inherit;
                font-weight: 600;
                color: #fff;
                background: var(--action);
            }
            @media (prefers-color-scheme: dark) {
                button {
                    color: #0f141b;
                }
            }
        </style>
    </head>
    <body>
        <img src="/icons/icon-192.png" alt="" width="72" height="72" />
        <h1 id="title">Sei senza rete</h1>
        <p id="text">
            Family Manager ha bisogno della rete per aprirsi. Controlla la
            connessione e riprova.
        </p>
        <button id="retry" type="button" onclick="location.reload()">
            Riprova
        </button>
        <script>
            // The page is kept as it is: the language is the one of the phone, as the app chooses it
            if (!/^it\b/i.test(navigator.language)) {
                document.documentElement.lang = 'en';
                document.getElementById('title').textContent =
                    'You are offline';
                document.getElementById('text').textContent =
                    'Family Manager needs the network to open. Check your connection and try again.';
                document.getElementById('retry').textContent = 'Try again';
            }
        </script>
    </body>
</html>
