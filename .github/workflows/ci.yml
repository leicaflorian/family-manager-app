name: ci

# Every check of the project. It runs only for a release: release.yml calls it on the `v*` tag (`workflow_call`,
# `secrets: inherit`), before the GitHub Release and the deploy. No run on pushes or pull requests (decision of the
# owner, 15/11/2026); `workflow_dispatch` lets it run by hand from the Actions page.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Pint, PHPStan, Rector, the types and vp check: no database
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITE_FORMKIT_PRO_KEY: ${{ secrets.VITE_FORMKIT_PRO_KEY || 'ci-placeholder-key' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      # The result caches of PHPStan and Rector (in the system temp dir): a new key every run, restored from the last
      - name: Cache PHPStan and Rector
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/phpstan
            /tmp/rector_cached_files
          key: static-${{ runner.os }}-${{ github.sha }}
          restore-keys: static-${{ runner.os }}-

      # The types import the Wayfinder routes, which the build generates
      - name: Build the front end
        run: npm run build

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Rector
        run: vendor/bin/rector --dry-run --no-progress-bar

      - name: Types
        run: npm run types

      # vp check: Oxfmt formatting and Oxlint
      - name: Format and lint
        run: npm run check

  pest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:9.7.2
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # The FormKit Pro key (repository secret). Vitest needs the real one: FormKit Pro checks it when the tests load
      # it (InvalidFormKitKey). Pull requests from forks get no secrets: with the placeholder the build and Pest still
      # pass, Vitest does not. This build is never deployed.
      VITE_FORMKIT_PRO_KEY: ${{ secrets.VITE_FORMKIT_PRO_KEY || 'ci-placeholder-key' }}
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password
      # The fake Directus of the Copy tests lives on the same server (`testing_directus`, created by the test itself)
      DIRECTUS_DB_HOST: 127.0.0.1
      DIRECTUS_DB_PORT: 3306
      DIRECTUS_DB_DATABASE: testing_directus
      DIRECTUS_DB_USERNAME: root
      DIRECTUS_DB_PASSWORD: password

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          system-packages: 'true'

      # public/build/manifest.json: DewarpCheckTest, AdminHostTest and RegistrationClosedTest need it
      - name: Build the front end
        run: npm run build

      # The tests that restart the app (refreshApplication) lose the database of their parallel process and go back
      # to `testing`, which needs the tables, as it has them in Sail.
      - name: Migrate the database of the tests
        run: php artisan migrate --force --no-interaction
        env:
          APP_ENV: testing

      # One job: Pest 4 does not take --shard together with --parallel
      - name: Pest
        run: php artisan test --parallel --processes=4

  # Vitest in two halves on two runners. No build: the Wayfinder plugin generates the routes when Vitest starts.
  vitest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      VITE_FORMKIT_PRO_KEY: ${{ secrets.VITE_FORMKIT_PRO_KEY || 'ci-placeholder-key' }}
      # Vitest loads vite.config.ts in serve mode, which laravel-vite-plugin refuses when CI is set
      LARAVEL_BYPASS_ENV_CHECK: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      # One worker per core of the runner (4), not the 8 of vite.config.ts meant for the Mac
      - name: Vitest
        run: npx vp test run --shard=${{ matrix.shard }}/2 --maxWorkers=4
